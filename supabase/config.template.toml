# Rendered only into this workspace's .context/local-supabase/supabase/config.toml.
project_id = "__PROJECT_ID__"
[api]
enabled = true
port = __API_PORT__
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = __DB_PORT__
shadow_port = __SHADOW_PORT__
major_version = 17
[db.pooler]
enabled = false
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:__API_PORT__"
[analytics]
enabled = false
[edge_runtime]
enabled = false
