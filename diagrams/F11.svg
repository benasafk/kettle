"134.98" y="217.00" width="183.69" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="137.98" y="226.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">1. Filter, refine, or change direction</text><line x1="104.00" y1="236.50" x2="349.64" y2="236.50" stroke="#142A38" stroke-width="0.85"/><polygon points="349.64,236.50 345.14,234.03 345.14,238.97" fill="#142A38"/><rect x="349.86" y="243.50" width="194.55" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="352.86" y="253.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">2. Resolve intent and visible idea IDs</text><line x1="349.64" y1="263.00" x2="389.64" y2="263.00" stroke="#142A38" stroke-width="0.85"/><line x1="389.64" y1="263.00" x2="389.64" y2="271.00" stroke="#142A38" stroke-width="0.85"/><line x1="389.64" y1="271.00" x2="349.64" y2="271.00" stroke="#142A38" stroke-width="0.85"/><polygon points="349.64,271.00 354.14,268.52 354.14,273.48" fill="#142A38"/><rect x="47.00" y="279.00" width="34.00" height="19.00" fill="#F5F7F8" stroke="#A8B5BC" stroke-width="0.60"/><text x="51.00" y="290.41" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="9.50" font-weight="700">opt</text><rect x="87.00" y="281.00" width="188.22" height="17.00" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="91.00" y="291.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50" font-weight="700">[Selection is stale or ambiguous]</text><rect x="384.13" y="304.00" width="176.66" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="387.13" y="313.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">3. Refresh saved result and order</text><line x1="349.64" y1="323.50" x2="595.28" y2="323.50" stroke="#142A38" stroke-width="0.85"/><polygon points="595.28,323.50 590.78,321.02 590.78,325.98" fill="#142A38"/><rect x="418.01" y="330.50" width="108.89" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="421.01" y="340.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">4. Current result IDs</text><line x1="595.28" y1="350.00" x2="349.64" y2="350.00" stroke="#142A38" stroke-width="0.85" stroke-dasharray="4 4"/><polygon points="349.64,350.00 354.14,347.52 354.14,352.48" fill="#142A38"/><rect x="130.17" y="357.00" width="193.29" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="133.17" y="366.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">5. Clarify the intended item if needed</text><line x1="349.64" y1="376.50" x2="104.00" y2="376.50" stroke="#142A38" stroke-width="0.85" stroke-dasharray="4 4"/><polygon points="104.00,376.50 108.50,374.02 108.50,378.98" fill="#142A38"/><rect x="47.00" y="392.50" width="34.00" height="19.00" fill="#F5F7F8" stroke="#A8B5BC" stroke-width="0.60"/><text x="51.00" y="403.91" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="9.50" font-weight="700">alt</text><rect x="87.00" y="394.50" width="199.08" height="17.00" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="91.00" y="405.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50" font-weight="700">[Existing cards satisfy the request]</text><rect x="380.86" y="417.50" width="132.56" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="383.86" y="427.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">6. Filter the loaded result</text><line x1="349.64" y1="437.00" x2="389.64" y2="437.00" stroke="#142A38" stroke-width="0.85"/><line x1="389.64" y1="437.00" x2="389.64" y2="445.00" stroke="#142A38" stroke-width="0.85"/><line x1="389.64" y1="445.00" x2="349.64" y2="445.00" stroke="#142A38" stroke-width="0.85"/><polygon points="349.64,445.00 354.14,442.52 354.14,447.48" fill="#142A38"/><rect x="128.91" y="454.00" width="195.82" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="131.91" y="463.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">7. Show matches or clear-filter option</text><line x1="349.64" y1="473.50" x2="104.00" y2="473.50" stroke="#142A38" stroke-width="0.85" stroke-dasharray="4 4"/><polygon points="104.00,473.50 108.50,471.02 108.50,475.98" fill="#142A38"/><line x1="47.00" y1="479.50" x2="1143.55" y2="479.50" stroke="#A8B5BC" stroke-width="0.60" stroke-dasharray="4 4"/><rect x="87.00" y="481.50" width="179.28" height="17.00" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="91.00" y="492.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50" font-weight="700">[User requests new references]</text><rect x="360.48" y="504.50" width="223.95" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="363.48" y="514.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">8. Start refinement with brief and result IDs</text><line x1="349.64" y1="524.00" x2="595.28" y2="524.00" stroke="#142A38" stroke-width="0.85"/><polygon points="595.28,524.00 590.78,521.52 590.78,526.48" fill="#142A38"/><rect x="595.17" y="531.00" width="195.21" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="598.17" y="540.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">9. Check entitlement and deduplicate</text><line x1="595.28" y1="550.50" x2="635.28" y2="550.50" stroke="#142A38" stroke-width="0.85"/><line x1="635.28" y1="550.50" x2="635.28" y2="558.50" stroke="#142A38" stroke-width="0.85"/><line x1="635.28" y1="558.50" x2="595.28" y2="558.50" stroke="#142A38" stroke-width="0.85"/><polygon points="595.28,558.50 599.78,556.02 599.78,560.98" fill="#142A38"/><rect x="651.49" y="567.50" width="133.21" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="654.49" y="577.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">10. Enqueue