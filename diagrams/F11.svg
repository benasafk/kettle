80"/><text x="164.18" y="709.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">15. Present new choices</text><line x1="349.64" y1="719.50" x2="104.00" y2="719.50" stroke="#142A38" stroke-width="0.85" stroke-dasharray="4 4"/><polygon points="104.00,719.50 108.50,717.02 108.50,721.98" fill="#142A38"/><line x1="47.00" y1="725.50" x2="1143.55" y2="725.50" stroke="#A8B5BC" stroke-width="0.60" stroke-dasharray="4 4"/><rect x="87.00" y="727.50" width="201.64" height="17.00" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="91.00" y="738.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50" font-weight="700">[Same idea; change only the script]</text><rect x="76.00" y="752.50" width="1038.55" height="24.50" fill="#F5F7F8" stroke="#A8B5BC" stroke-width="0.50"/><text x="448.90" y="765.47" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="11.50">Continue: Continue through F13 without reference search</text><line x1="42.00" y1="948.00" x2="1148.55" y2="948.00" stroke="#A8B5BC" stroke-width="0.60"/><text x="42.00" y="964.79" fill="#136F63" font-family="Arial,Helvetica,sans-serif" font-size="8.70" font-weight="700">RULE / DECISION</text><text x="145.00" y="965.41" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="9.50">An empty filter is not a failed search. A genuine new search may consume allowance; local filtering does not incur another provider search.</text></svg>