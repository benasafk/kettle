<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.55 1040.00" role="img" aria-labelledby="F26-title F26-desc"><title id="F26-title">F26 - Switch chat or device; use text fallback</title><desc id="F26-desc">The same account reaches current work and actions stay tied to the correct selection.</desc><rect x="0.00" y="0.00" width="1190.55" height="1040.00" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="42.00" y="31.80" fill="#136F63" font-family="Arial,Helvetica,sans-serif" font-size="10.00" font-weight="700">KETTLE / PRODUCT SYSTEMS</text><text x="959.08" y="31.80" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="10.00">RECOVERY AND ACCOUNT LIFECYCLE</text><line x1="42.00" y1="43.00" x2="1148.55" y2="43.00" stroke="#A8B5BC" stroke-width="0.70"/><line x1="42.00" y1="1002.00" x2="1148.55" y2="1002.00" stroke="#A8B5BC" stroke-width="0.70"/><text x="42.00" y="1019.63" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="8.50">PROPOSED FLOWS  |  06 OCT 2026  |  ORIGINAL REFERENCES PRESERVED</text><text x="1138.54" y="1020.02" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="9.00">28</text><text x="42.00" y="76.94" fill="#136F63" font-family="Arial,Helvetica,sans-serif" font-size="23.00" font-weight="700">F26</text><text x="107.00" y="76.94" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="23.00" font-weight="700">Switch chat or device; use text fallback</text><text x="42.00" y="101.80" fill="#136F63" font-family="Arial,Helvetica,sans-serif" font-size="10.00" font-weight="700">SCOPE: Baseline</text><text x="42.00" y="124.19" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="10.50">Entry: User opens Kettle in another chat/device or without a usable panel.</text><text x="42.00" y="142.19" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="10.50">Outcome: The same account reaches current work and actions stay tied to the correct selection.</text><line x1="104