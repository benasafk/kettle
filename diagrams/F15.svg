<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.55 1040.00" role="img" aria-labelledby="F15-title F15-desc"><title id="F15-title">F15 - Undo, restore history, or resolve conflict</title><desc id="F15-desc">A deliberate current version is saved while all previous revisions remain.</desc><rect x="0.00" y="0.00" width="1190.55" height="1040.00" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="42.00" y="31.80" fill="#136F63" font-family="Arial,Helvetica,sans-serif" font-size="10.00" font-weight="700">KETTLE / PRODUCT SYSTEMS</text><text x="1025.20" y="31.80" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="10.00">DISCOVERY AND STUDIO</text><line x1="42.00" y1="43.00" x2="1148.55" y2="43.00" stroke="#A8B5BC" stroke-width="0.70"/><line x1="42.00" y1="1002.00" x2="1148.55" y2="1002.00" stroke="#A8B5BC" stroke-width="0.70"/><text x="42.00" y="1019.63" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="8.50">PROPOSED FLOWS  |  06 OCT 2026  |  ORIGINAL REFERENCES PRESERVED</text><text x="1138.54" y="1020.02" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="9.00">17</text><text x="42.00" y="76.94" fill="#136F63" font-family="Arial,Helvetica,sans-serif" font-size="23.00" font-weight="700">F15</text><text x="107.00" y="76.94" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="23.00" font-weight="700">Undo, restore history, or resolve conflict</text><text x="42.00" y="101.80" fill="#136F63" font-family="Arial,Helvetica,sans-serif" font-size="10.00" font-weight="700">SCOPE: Baseline</text><text x="42.00" y="124.19" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="10.50">Entry: User requests undo, chooses an earlier version, or encounters a stale edit.</text><text x="42.00" y="142.19" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="10.50">Outcome: A deliberate current version is saved while all previous revisions remain.</text><line x1="104.00" y1="206.00" x2