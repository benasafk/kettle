text x="205.76" y="489.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">10. Show restored script</text><line x1="431.52" y1="499.00" x2="104.00" y2="499.00" stroke="#142A38" stroke-width="0.85" stroke-dasharray="4 4"/><polygon points="104.00,499.00 108.50,496.52 108.50,501.48" fill="#142A38"/><line x1="47.00" y1="505.00" x2="1143.55" y2="505.00" stroke="#A8B5BC" stroke-width="0.60" stroke-dasharray="4 4"/><rect x="87.00" y="507.00" width="203.53" height="17.00" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="91.00" y="517.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50" font-weight="700">[Another chat saved newer content]</text><rect x="494.81" y="530.00" width="200.94" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="497.81" y="539.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">11. Conflict; newest version preserved</text><line x1="759.03" y1="549.50" x2="431.52" y2="549.50" stroke="#142A38" stroke-width="0.85" stroke-dasharray="4 4"/><polygon points="431.52,549.50 436.02,547.02 436.02,551.98" fill="#142A38"/><rect x="477.21" y="556.50" width="236.13" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="480.21" y="566.47" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">12. Read newest content and chosen version</text><line x1="431.52" y1="576.00" x2="759.03" y2="576.00" stroke="#142A38" stroke-width="0.85"/><polygon points="759.03,576.00 754.53,573.52 754.53,578.48" fill="#142A38"/><rect x="547.85" y="583.00" width="94.85" height="13.50" fill="#FFFFFF" stroke="none" stroke-width="0.80"/><text x="550.85" y="592.97" fill="#142A38" font-family="Arial,Helvetica,sans-serif" font-size="11.50">13. Both versions</text><line x1="759.03" y1="602.50" x2="431.52" y2="602.50" stroke="#142A38" stroke-width="0.85" stroke-dasharray="4 4"/><polygon points="431.52,602.50 436.02,600.02 436.02,604.98" fill="#142A38"