t><text x="145.00" y="965.41" fill="#4B616C" font-family="Arial,Helvetica,sans-serif" font-size="9.50">Account export differs from script export. Do not promise instant erasure from backups or third parties. Billing, legal records and provider retention need an adopted policy.</text></svg>